name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      # iconic-py (PyO3 extension) is built separately with maturin, not plain cargo.

  python-test:
    name: Python tests (iconic-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release
      - name: Install test dependencies
        run: python3 -m pip install cvxpy scipy pytest
      - name: Run CVXPY tests
        run: python3 -m pytest iconic-py/tests/test_cvxpy.py -v
